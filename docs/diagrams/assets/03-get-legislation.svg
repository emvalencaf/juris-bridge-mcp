<svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="get-legislation-title get-legislation-desc" id="d-03-get-legislation-root">
<title id="get-legislation-title">get_legislation text fallback chain</title>
<desc id="get-legislation-desc">Flowchart showing how get_legislation finds the text of a Norm in the Planalto, falls back to Câmara Legin when the Planalto fails or has no page, and what content_kind, text_source and warnings report.</desc>
<defs>
      <style>#d-03-get-legislation-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d-03-get-legislation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-03-get-legislation-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-get-legislation-root .diagram-container { overflow-x: visible; }</style>
