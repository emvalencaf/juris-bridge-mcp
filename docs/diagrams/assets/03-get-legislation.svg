<rect x="760" y="556" width="240" height="96" rx="20" fill="#f5f5f5"/><rect x="760" y="556" width="240" height="96" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="880" y="596" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">content_kind: full_text</text><text x="880" y="612" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle">text_source: camara_legin</text><text x="880" y="624" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle">warnings[] says why</text>
<text x="40" y="740" fill="#2d3142" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">If the Planalto itself failed (blocked, unavailable, rate limited) and Câmara Legin has no page either,</text>
<text x="40" y="760" fill="#2d3142" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">the Planalto Error code is raised, never a bare "no text". Only those three codes fall back.</text>
