<polygon points="480,264 608,316 480,368 352,316" fill="#f5f5f5"/><polygon points="480,264 608,316 480,368 352,316" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="314" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Text asked for?</text><text x="480" y="330" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">include_text or article</text>
<polygon points="480,408 608,460 480,512 352,460" fill="#f5f5f5"/><polygon points="480,408 608,460 480,512 352,460" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="458" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Planalto text page?</text><text x="480" y="474" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cached per URN Lex</text>
<polygon points="480,552 608,604 480,656 352,604" fill="#f5f5f5"/><polygon points="480,552 608,604 480,656 352,604" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="480" y="602" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Câmara Legin page?</text><text x="480" y="618" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">via the LexML URN page</text>
